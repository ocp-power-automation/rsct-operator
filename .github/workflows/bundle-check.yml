name: Bundle Up-to-date Check

on:
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.27"

jobs:
  bundle-check:
    name: Verify bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run make bundle
        run: make bundle

      - name: Check bundle directory is up to date
        run: |
          # createdAt is stamped with the current time on every `generate bundle`
          # run, so exclude it from the meaningful diff.
          DIFF=$(git diff bundle/ | grep -v '^[+-][[:space:]]*createdAt:' | grep -E '^[+-][^+-]' || true)
          if [ -n "$DIFF" ]; then
            git diff bundle/ | grep -v '^[+-][[:space:]]*createdAt:'
            echo ""
            echo "❌ The bundle/ directory is out of date."
            echo "   Run 'make bundle' locally and commit the changes."
            exit 1
          fi
          echo "✅ bundle/ is up to date."
