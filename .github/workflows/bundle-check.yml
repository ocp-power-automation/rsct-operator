name: Bundle Up-to-date Check

on:
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.26"
  OPERATOR_SDK_VERSION: "v1.42.0"

jobs:
  bundle-check:
    name: Verify bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install operator-sdk
        run: |
          mkdir -p bin
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -sSLo bin/operator-sdk \
            https://github.com/operator-framework/operator-sdk/releases/download/${{ env.OPERATOR_SDK_VERSION }}/operator-sdk_${OS}_${ARCH}
          chmod +x bin/operator-sdk

      - name: Run make bundle
        run: make bundle

      - name: Check bundle directory is up to date
        run: |
          if ! git diff --exit-code bundle/; then
            echo ""
            echo "❌ The bundle/ directory is out of date."
            echo "   Run 'make bundle' locally and commit the changes."
            exit 1
          fi
          echo "✅ bundle/ is up to date."
